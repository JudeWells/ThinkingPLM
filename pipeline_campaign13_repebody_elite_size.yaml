## Campaign 13: Repebody scaffold + elitism + ipSAE + size penalty
##
## 258aa repebody (7YC0) with elitism enabled. Jointly optimizes
## interface quality (ipSAE) and miniaturization toward 240 residues.
## Both energy terms weighted to contribute ~0.4 magnitude.

initial_fasta: initial_sequence_repebody_7YC0.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: example_energy_boltz_ipsae_size_2GDZ.yaml

f_inject: 0.25
max_cycles: 200
output_dir: outputs/campaign13_repebody_elite_size
softmax_temperature: 0.01
random_seed: 131313
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
