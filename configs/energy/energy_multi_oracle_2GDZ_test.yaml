## Multi-oracle energy test: ESMFold + Boltz2 + Chai-1 + AF2BindCraft
##
## Target: 2GDZ (15-PGDH)
## Extracts plDDT, iPTM, and ipSAE from all 4 oracles simultaneously.
## Each energy term references a named folding oracle via the `oracle` key.
## This file is a smoke-test config — uses minimal Chai1/Boltz/AF2 settings.

folding_oracles:
  esmfold:
    type: BatchedESMFold
    kwargs:
      use_modal: false
      max_batch_size: 16
  boltz2:
    type: Boltz
    kwargs: {}
  chai1:
    type: Chai1
    kwargs:
      num_diffn_samples: 1
      num_diffn_timesteps: 100
      num_trunk_recycles: 2
      use_esm_embeddings: true
      use_msa_server: false
  af2:
    type: AF2BindCraft
    kwargs:
      target_pdb: /mnt/disk2/ThinkingPLM/target_pdbs/2GDZ.pdb
      target_chain: A
      conda_env: BindCraft
      af_params_dir: /mnt/disk2/BindCraft/params
      num_recycles: 1
      prediction_models: [0]

energies:
  # --- ESMFold metrics ---
  - type: ipSAEEnergy
    oracle: esmfold
    kwargs:
      weight: 0.25
      pae_cutoff: 12.0
      name: esm
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: PLDDTEnergy
    oracle: esmfold
    kwargs:
      weight: 0.025
      name: esm
      residues:
        GEN: "all"

  # --- Boltz2 metrics ---
  - type: ipSAEEnergy
    oracle: boltz2
    kwargs:
      weight: 0.25
      pae_cutoff: 10.0
      name: b2
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: iPTMEnergy
    oracle: boltz2
    kwargs:
      weight: 0.05
      name: b2
  - type: PLDDTEnergy
    oracle: boltz2
    kwargs:
      weight: 0.025
      name: b2
      residues:
        GEN: "all"

  # --- Chai-1 metrics ---
  - type: ipSAEEnergy
    oracle: chai1
    kwargs:
      weight: 0.25
      pae_cutoff: 10.0
      name: chai
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: iPTMEnergy
    oracle: chai1
    kwargs:
      weight: 0.05
      name: chai
  - type: PLDDTEnergy
    oracle: chai1
    kwargs:
      weight: 0.025
      name: chai
      residues:
        GEN: "all"

  # --- AF2 BindCraft metrics ---
  - type: iPTMEnergy
    oracle: af2
    kwargs:
      weight: 0.05
      name: af2
  - type: PLDDTEnergy
    oracle: af2
    kwargs:
      weight: 0.025
      name: af2
      residues:
        GEN: "all"
