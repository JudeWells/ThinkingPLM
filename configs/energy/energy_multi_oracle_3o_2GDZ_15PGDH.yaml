## Multi-oracle energy: ESMFold + Boltz2 + Chai-1  (no AF2BindCraft)
##
## Target: 2GDZ (15-PGDH)
## Runs 3 folding oracles per sequence and extracts ipSAE, iPTM, PLDDT,
## and PAE from each.
##
## Per-oracle weight totals (summed across oracles that support each term):
##   - ipSAE total ~1.0    (0.333 each × 3 oracles)
##   - iPTM  total ~0.05   (0.025 each × 2 oracles — ESMFold excluded, no chain_pair_iptm)
##   - PLDDT total ~0.1    (0.033 each × 3 oracles)
##   - PAE   total ~0.01   (0.0033 each × 3 oracles) [cross-term only, interface PAE]
##   - SolMPNN total ~0.03 (0.01 each × 3 oracles — designability on every backbone)
##
## Single-oracle terms (attached to ESMFold, cheapest in-process):
##   - HydrophobicEnergy:       0.05  (surface mode, GEN chain only)
##   - GlobularEnergy:          0.02  (compactness prior, GEN chain only)
##
## Oracle-independent:
##   - OneSidedBinderLengthEnergy: 1.0 weight, 0.01/res over 120 (binder only)
##
## Thompson reward signal is always the composite weighted total energy.

folding_oracles:
  esmfold:
    type: BatchedESMFold
    kwargs:
      use_modal: false
      max_batch_size: 16
  boltz2:
    type: Boltz
    kwargs:
      # Internal ensemble — Boltz runs 10 diffusion samples and averages
      # scalar + tensor metrics (pTM, iPTM, pLDDT, PAE) into one BoltzResult
      # before the energy terms see it.  ~10× slower per fold than samples=1.
      diffusion_samples: 10
  chai1:
    type: Chai1
    kwargs:
      # Chai-1 native ensemble — 10 diffusion samples averaged into one result.
      num_diffn_samples: 10
      num_diffn_timesteps: 100
      num_trunk_recycles: 2
      use_esm_embeddings: true
      use_msa_server: false

# Oracles within a group run concurrently (ThreadPoolExecutor).  Groups run
# serially.  Omit for pure serial (legacy).  Memory budgeting is the user's
# responsibility — see CLAUDE.md for the sizing heuristic.
#
# On a 40-48 GB GPU (L40S, A100-40) boltz2+chai1 fit together because Boltz
# is subprocess-isolated (~10-15 GB in a separate process) and Chai-1 uses
# ~15-25 GB in the main process.  Add esmfold to the same group only on
# 80 GB cards.  On tight GPUs, comment this key out.
oracle_parallel_groups:
  - [boltz2, chai1]
  - [esmfold]

energies:
  # --- ESMFold metrics ---
  # ESMFold's result class has no chain_pair_iptm → iPTMEnergy excluded.
  - type: ipSAEEnergy
    oracle: esmfold
    kwargs:
      weight: 0.333
      pae_cutoff: 12.0
      name: esm
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: PLDDTEnergy
    oracle: esmfold
    kwargs:
      weight: 0.033
      name: esm
      residues:
        GEN: "all"
  - type: PAEEnergy
    oracle: esmfold
    kwargs:
      weight: 0.0033
      name: esm
      cross_term_only: true
      residues:
        GEN: "all"
        B: "all"

  # --- Boltz2 metrics ---
  - type: ipSAEEnergy
    oracle: boltz2
    kwargs:
      weight: 0.333
      pae_cutoff: 10.0
      name: b2
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: iPTMEnergy
    oracle: boltz2
    kwargs:
      weight: 0.025
      name: b2
  - type: PLDDTEnergy
    oracle: boltz2
    kwargs:
      weight: 0.033
      name: b2
      residues:
        GEN: "all"
  - type: PAEEnergy
    oracle: boltz2
    kwargs:
      weight: 0.0033
      name: b2
      cross_term_only: true
      residues:
        GEN: "all"
        B: "all"

  # --- Chai-1 metrics ---
  - type: ipSAEEnergy
    oracle: chai1
    kwargs:
      weight: 0.333
      pae_cutoff: 10.0
      name: chai
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
  - type: iPTMEnergy
    oracle: chai1
    kwargs:
      weight: 0.025
      name: chai
  - type: PLDDTEnergy
    oracle: chai1
    kwargs:
      weight: 0.033
      name: chai
      residues:
        GEN: "all"
  - type: PAEEnergy
    oracle: chai1
    kwargs:
      weight: 0.0033
      name: chai
      cross_term_only: true
      residues:
        GEN: "all"
        B: "all"

  # --- SolMPNN designability (one per oracle) ---
  # Oracle-agnostic: scores how well the binder sequence matches each
  # predictor's backbone.  Weights 0.01 × 3 = 0.03 total (same as the
  # previous single-oracle setup).  Useful as a consensus filter — a
  # sequence that scores well under all three backbones is more likely
  # designable than one that only pleases a single oracle.
  - type: SolMPNNPerplexityEnergy
    oracle: esmfold
    kwargs:
      weight: 0.01
      name: esm
      residues:
        GEN: "all"
      use_modal: false
      proteinmpnn_env: proteinmpnn
      # Relative to the ThinkingPLM repo root — created by setup_environment.sh.
      proteinmpnn_path: .proteinmpnn_repo
      backbone_noise: 0.1
      ensemble_n: 10
      decoding_order: random
  - type: SolMPNNPerplexityEnergy
    oracle: boltz2
    kwargs:
      weight: 0.01
      name: b2
      residues:
        GEN: "all"
      use_modal: false
      proteinmpnn_env: proteinmpnn
      proteinmpnn_path: .proteinmpnn_repo
      backbone_noise: 0.1
      ensemble_n: 10
      decoding_order: random
  - type: SolMPNNPerplexityEnergy
    oracle: chai1
    kwargs:
      weight: 0.01
      name: chai
      residues:
        GEN: "all"
      use_modal: false
      proteinmpnn_env: proteinmpnn
      proteinmpnn_path: .proteinmpnn_repo
      backbone_noise: 0.1
      ensemble_n: 10
      decoding_order: random

  # --- Structure-derived single-oracle terms (attached to ESMFold) ---
  - type: HydrophobicEnergy
    oracle: esmfold
    kwargs:
      weight: 0.05
      name: esm
      mode: surface
      residues:
        GEN: "all"
  - type: GlobularEnergy
    oracle: esmfold
    kwargs:
      weight: 0.02
      name: esm
      residues:
        GEN: "all"

  # --- Binder length penalty (oracle-independent) ---
  # Threshold raised to 140 so the longest BindCraft seed (l140) starts at
  # zero penalty.  Shorter seeds (≤121 aa) also unaffected — penalty only
  # activates when binder_length > threshold.
  - type: OneSidedBinderLengthEnergy
    kwargs:
      weight: 1.0
      threshold: 140
      penalty_per_residue: 0.01
      binder_chain_id: GEN
