## Energy configuration: ColabFold + ipSAE scoring (multi-chain binding)
##
## Folds the generated sequence together with the 15-PGDH target (2GDZ)
## using ColabFold and scores the interface with ipSAE.
##
## ColabFold runs locally via CLI subprocess.
## For HP search speed: num_models=1, num_recycle=1.
## For production accuracy: num_models=5, num_recycle=3.

folding_oracle:
  type: ColabFold
  kwargs:
    num_models: 1
    num_recycle: 1
    msa_mode: "single_sequence"
    timeout: 1800

energies:
  - type: ipSAEEnergy
    kwargs:
      weight: 1.0
      pae_cutoff: 10.0
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
