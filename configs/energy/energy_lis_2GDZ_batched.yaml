## Energy configuration: BatchedESMFold (local GPU) + LIS scoring
##
## Same as energy_lis_2GDZ_local.yaml but uses BatchedESMFold for
## ~5-8x faster folding by processing all sequences in one forward pass.

folding_oracle:
  type: BatchedESMFold
  kwargs:
    use_modal: false
    max_batch_size: 16

energies:
  - type: LISEnergy
    kwargs:
      weight: 1.0
      pae_cutoff: 12.0
      intensive: true
      target: MAHMVNGKVALVTGAAQGIGRAFAEALLLKGAKVALVDWNLEAGVQCKAALHEQFEPQKTLFIQCDVADQQQLRDTFRKVVDHFGRLDILVNNAGVNNEKNWEKTLQINLVSVISGTYLGLDYMSKQNGGEGGIIINMSSLAGLMPVAQQPVYCASKHGIVGFTRSAALAANLMNSGVRLNAICPGFVNTAILESIEKEENMGQYIEYKDHIKDMIKYYGILDPPLIANGLITLIEDDALNGAIMKITTSKGIHFQDYGSKENLYFQ
      residues:
        GEN: "all"
        B: "all"
