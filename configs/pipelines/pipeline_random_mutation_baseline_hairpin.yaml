## Random mutation baseline: Hairpin scaffold + elitism
##
## Same setup as campaign6 but uses random amino acid substitutions
## instead of ProFam for proposing candidate sequences.
## Serves as a baseline for benchmarking ProFam-guided proposals.

initial_fasta: configs/sequences/initial_sequence_hairpin.fasta

proposal_method: random_mutation
max_mutations: 5
profam_num_samples: 8

energy_config: configs/energy/example_energy_boltz_ipsae_2GDZ.yaml

f_inject: 0.25
max_cycles: 200
output_dir: outputs/random_mutation_baseline_hairpin_m5
softmax_temperature: 0.01
random_seed: 666666
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
