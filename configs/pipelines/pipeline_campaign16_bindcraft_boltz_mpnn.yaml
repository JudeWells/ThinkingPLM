## Campaign 16: BindCraft de novo scaffold + Boltz + ipSAE + MPNN
##
## 122aa de novo scaffold from BindCraft, scored with Boltz folding,
## ipSAE interface quality, and SolubleMPNN designability.

initial_fasta: configs/sequences/initial_sequence_bindcraft_de_novo.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/example_energy_boltz_ipsae_mpnn_2GDZ.yaml

f_inject: 0.25
max_cycles: 50
output_dir: outputs/campaign16_bindcraft_boltz_mpnn
softmax_temperature: 0.01
random_seed: 160001
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
