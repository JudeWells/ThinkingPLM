## GRPO + LIS campaign: hairpin scaffold with online RL
##
## Uses ESMFold + LIS energy (fast) with same-batch GRPO model updates.
## Each cycle: generate → fold+score → update prompt (best seq) AND
## update model weights (GRPO on full scored batch).

initial_fasta: configs/sequences/initial_sequence_hairpin.fasta
profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/energy_lis_2GDZ_local.yaml

f_inject: 0.25
max_cycles: 50
output_dir: outputs/grpo_lis_hairpin
softmax_temperature: 0.01
random_seed: 42
run_on_modal: false
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true

# GRPO: same-batch dual use (zero extra scoring cost)
grpo_enabled: true
grpo_lr: 1e-5
grpo_group_size: 16
grpo_clip_ratio: 0.2
grpo_beta: 0.05
grpo_temperature: 1.0
rl_every_n_cycles: 1
rl_steps_per_cycle: 1

# Weights & Biases
wandb_enabled: true
wandb_project: profam-bagel-pipeline
wandb_tags: ["grpo", "lis", "hairpin", "2GDZ"]
