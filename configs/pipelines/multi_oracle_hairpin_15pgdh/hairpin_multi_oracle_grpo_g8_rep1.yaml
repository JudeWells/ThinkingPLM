## Multi-oracle hairpin 15PGDH bandit_grpo (rep 1)
## Oracles: ESMFold + Boltz2  (Chai-1 dropped for speed; AF2BindCraft not on node)
## Boltz2 runs with diffusion_samples=10 internal ensemble.
## Energy: ipSAE + PLDDT + PAE from each oracle + iPTM from Boltz2
##       + SolMPNN (w=0.1) / Hydrophobic / Globular on ESMFold
##       + binder length penalty (>120)
## GRPO: profam_num_samples=4, grpo_replay_cycles=63
##       → effective replay buffer = 4 × 64 = 256 samples

accept_only_improvement: true
bt_enabled: false
deduplicate_sequences: true
elitism: true
energy_config: configs/energy/energy_multi_oracle_2o_2GDZ_15PGDH.yaml
enforce_template: false
f_inject: 0.25
freeze_prompt: false
grpo_beta: 0.0
grpo_clip_ratio: 0.2
grpo_enabled: true
grpo_group_size: 8
grpo_lr: 2e-05
grpo_replay_cycles: 63
grpo_temperature: 1.0
grpo_use_reference_model: false
initial_fasta: configs/sequences/initial_sequence_hairpin.fasta
likelihood_eval_every: 5
likelihood_track_n: 10
max_cycles: 450
max_mutations: 1
n_memory: 0
output_dir: outputs/multi_oracle_hairpin_15pgdh/bandit_grpo_g8_rep1
output_frequency: 1
profam_checkpoint_dir: .profam_repo/model_checkpoints/profam-1
profam_max_tokens: 8192
profam_num_samples: 4
profam_sampler: single
profam_temperature: 0.7
profam_top_p: 0.95
proposal_bandit_prior_alpha: 2.0
proposal_bandit_prior_beta: 2.0
proposal_bandit_relative_reward: false
proposal_method: profam
random_seed: 41771
reinject_initial: false
rl_every_n_cycles: 1
rl_steps_per_cycle: 1
run_on_modal: false
sample_with_reinsertion: false
selection_strategy: greedy
softmax_temperature: 0.01
thompson_exploit_bias: 8.0
thompson_m_samples: 1
thompson_max_arms: 10
thompson_max_identity: 0.95
thompson_proposal_bandit: true
wandb_enabled: true
wandb_project: profam-bagel-pipeline
wandb_run_name: mohp_grpo_g8_rep1
wandb_tags:
  - multi_oracle_hairpin_15pgdh
  - bandit_grpo
  - group8
  - rep1
  - multi_oracle
