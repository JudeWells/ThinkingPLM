## Benchmark: Greedy selection with diverse arm pruning + relative reward — 2GDZ_15PGDH / nanobody
##
## Key features:
## - thompson_max_arms=10: limits arms to top-K diverse sequences
## - proposal_bandit_relative_reward=true: rewards based on improvement over parent
##   (prevents lock-in from absolute energy inflation over time)
## - Beta(2,2) prior: slightly informative prior for proposal bandit

initial_fasta: configs/sequences/initial_sequence_nanobody_like.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 1
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/example_energy_boltz_ipsae_2GDZ_15PGDH.yaml

f_inject: 0.25
max_cycles: 100
output_dir: outputs/bench/2GDZ_15PGDH/nanobody/greedy_diverse_rel
softmax_temperature: 0.01
random_seed: 411995
run_on_modal: false
output_frequency: 1
enforce_template: false
sample_with_reinsertion: false
reinject_initial: true
n_memory: 0
elitism: true
accept_only_improvement: true

proposal_method: profam
max_mutations: 5
freeze_prompt: false

# Selection: greedy with proposal bandit
selection_strategy: greedy
thompson_m_samples: 1
thompson_reward_term: ipSAE
thompson_exploit_bias: 5.0
thompson_temperature_bins: null
thompson_proposal_bandit: true

# Proposal bandit: Beta(2,2) prior + relative reward
proposal_bandit_prior_alpha: 2.0
proposal_bandit_prior_beta: 2.0
proposal_bandit_relative_reward: true

# Diverse arm pruning
thompson_max_arms: 10
thompson_max_identity: 0.95

deduplicate_sequences: true
