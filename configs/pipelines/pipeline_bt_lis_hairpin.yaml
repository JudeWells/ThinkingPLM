## Bradley-Terry ranking loss: hairpin scaffold
##
## Uses BT pairwise ranking loss instead of GRPO.
## Accumulates a pool of scored sequences across cycles and trains
## the model to rank them by energy (lower energy = higher likelihood).

initial_fasta: configs/sequences/initial_sequence_hairpin.fasta
profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 12
profam_max_tokens: 8192
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/energy_lis_2GDZ_local.yaml

f_inject: 0.25
max_cycles: 450
output_dir: outputs/bt_lis_hairpin
softmax_temperature: 0.01
random_seed: 42
run_on_modal: false
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true

# No GRPO
grpo_enabled: false

# Bradley-Terry ranking loss
bt_enabled: true
bt_lr: 1e-5
bt_pool_size: 64
bt_batch_size: 32
bt_sub_batch_size: 4
bt_every_n_cycles: 1
bt_steps_per_cycle: 1

# Tracking
likelihood_eval_every: 5
likelihood_track_n: 10

# Weights & Biases
wandb_enabled: true
wandb_project: profam-bagel-pipeline
wandb_run_name: bt_lr1e-05_hairpin
wandb_tags: ["bradley-terry", "lis", "hairpin", "2GDZ"]
