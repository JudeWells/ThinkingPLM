## Benchmark: 2GDZ_15PGDH / 4D5 / greedy_proposal_bandit
##
## Greedy elitist prompt selection + Thompson proposal bandit
## selection_strategy: greedy, thompson_proposal_bandit: true
## Always conditions on current best (like random_update),
## but Thompson bandit chooses between profam and random_mutation.

initial_fasta: configs/sequences/initial_sequence_human_single_domain_antibody_4D5.fasta
profam_checkpoint_dir: .profam_repo/model_checkpoints/profam-1
profam_sampler: single
profam_num_samples: 1
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95
energy_config: configs/energy/example_energy_boltz_ipsae_2GDZ_15PGDH.yaml
f_inject: 0.25
max_cycles: 100
output_dir: outputs/bench/2GDZ_15PGDH/4D5/greedy_proposal_bandit
softmax_temperature: 0.01
random_seed: 263032
run_on_modal: false
output_frequency: 1
enforce_template: false
sample_with_reinsertion: false
reinject_initial: true
n_memory: 0
elitism: true
accept_only_improvement: true
max_mutations: 5
proposal_method: profam
freeze_prompt: false
selection_strategy: greedy
thompson_m_samples: 1
thompson_reward_term: ipSAE
thompson_exploit_bias: 5.0
thompson_temperature_bins: null
thompson_proposal_bandit: true
deduplicate_sequences: true
