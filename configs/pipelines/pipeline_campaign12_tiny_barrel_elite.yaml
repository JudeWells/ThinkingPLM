## Campaign 12: Tiny_barrel scaffold + elitism + ipSAE only
##
## 87aa tiny_barrel scaffold with elitism enabled. Scores interface
## quality with ipSAE against 2GDZ target.

initial_fasta: configs/sequences/initial_sequence_tiny_barrel.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/example_energy_boltz_ipsae_2GDZ.yaml

f_inject: 0.25
max_cycles: 200
output_dir: outputs/campaign12_tiny_barrel_elite
softmax_temperature: 0.01
random_seed: 121212
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
