## Campaign 17: Boltz2 de novo scaffold + ESMFold (fast fold) + LIS + ipSAE
##
## 113aa de novo scaffold from BoltzGen, scored with ESMFold fast folding,
## LIS and ipSAE interface metrics.

initial_fasta: configs/sequences/initial_sequence_boltz2_de_novo.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/example_energy_lis_ipsae_2GDZ.yaml

f_inject: 0.25
max_cycles: 50
output_dir: outputs/campaign17_boltzgen_esmfold
softmax_temperature: 0.01
random_seed: 170001
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
