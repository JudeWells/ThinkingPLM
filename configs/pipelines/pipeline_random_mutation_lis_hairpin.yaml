## Random mutation baseline: hairpin scaffold
##
## Same energy function and pipeline settings as GRPO runs, but proposals
## come from random single-point mutations instead of ProFam.
## No GRPO training — pure evolutionary search baseline.

initial_fasta: configs/sequences/initial_sequence_hairpin.fasta
profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"

energy_config: configs/energy/energy_lis_2GDZ_local.yaml

proposal_method: random_mutation
max_mutations: 1
profam_num_samples: 12

f_inject: 0.25
max_cycles: 200
output_dir: outputs/grpo_hp_sweep_v2/v2_random_mutation
softmax_temperature: 0.01
random_seed: 42
run_on_modal: false
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true

grpo_enabled: false

wandb_enabled: true
wandb_project: profam-bagel-pipeline
wandb_run_name: v2_random_mutation
wandb_tags: ["sweep_v2", "random_mutation", "baseline", "lis", "hairpin"]
