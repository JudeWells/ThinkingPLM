## 2GDZ Campaign: rfd3_inpaint / random_thompson
##
## Target: 2GDZ_15PGDH (15-Hydroxyprostaglandin Dehydrogenase)
## Scaffold: rfd3_inpaint
## Strategy: random_thompson
## boltz_ensemble_n: 6, max_cycles: 600

initial_fasta: configs/sequences/initial_sequence_rfd3_inpaint.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 1
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/example_energy_boltz_ipsae_2GDZ_15PGDH.yaml

f_inject: 0.25
max_cycles: 600
output_dir: outputs/2gdz_campaign/rfd3_inpaint/random_thompson
softmax_temperature: 0.01
random_seed: 397985
run_on_modal: false
output_frequency: 1
enforce_template: false
sample_with_reinsertion: false
reinject_initial: true
n_memory: 0
elitism: true
accept_only_improvement: true

# Proposal method
proposal_method: random_mutation
max_mutations: 5
freeze_prompt: false

# Selection strategy
selection_strategy: thompson
thompson_m_samples: 1
thompson_reward_term: ipSAE
thompson_exploit_bias: 5.0
thompson_temperature_bins: null

# Proposal bandit
thompson_proposal_bandit: false
proposal_bandit_prior_alpha: 2.0
proposal_bandit_prior_beta: 2.0
proposal_bandit_relative_reward: false

# Diverse arm pruning
thompson_max_arms: 10
thompson_max_identity: 0.95

deduplicate_sequences: true
boltz_ensemble_n: 6
