## GRPO + LIS + proposal bandit test
## Tests that GRPO works correctly when alternating between profam and random_mutation.

initial_fasta: configs/sequences/initial_sequence_hairpin.fasta
profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: configs/energy/energy_lis_2GDZ_local.yaml

f_inject: 0.25
max_cycles: 6
output_dir: outputs/grpo_lis_hairpin_bandit_test
softmax_temperature: 0.01
random_seed: 42
run_on_modal: false
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true

# Thompson selection + proposal bandit
selection_strategy: thompson
thompson_reward_term: LIS
thompson_proposal_bandit: true
proposal_bandit_prior_alpha: 2.0
proposal_bandit_prior_beta: 2.0
thompson_max_arms: 20
thompson_max_identity: 0.95
max_mutations: 3

# GRPO
grpo_enabled: true
grpo_lr: 1e-5
grpo_clip_ratio: 0.2
grpo_beta: 0.05
rl_every_n_cycles: 1
rl_steps_per_cycle: 1

wandb_enabled: false
