## Campaign 6: Hairpin scaffold + elitism
##
## 80aa hairpin starter with elitism enabled. The global best
## sequence is guaranteed to survive every cycle, preventing
## regression. Uses Boltz + ipSAE scoring against 2GDZ target.

initial_fasta: initial_sequence_hairpin.fasta

profam_checkpoint_dir: ".profam_repo/model_checkpoints/profam-1"
profam_sampler: single
profam_num_samples: 8
profam_max_tokens: 8192
profam_max_generated_length: null
profam_temperature: 0.8
profam_top_p: 0.95

energy_config: example_energy_boltz_ipsae_2GDZ.yaml

f_inject: 0.25
max_cycles: 200
output_dir: outputs/campaign6_hairpin_elite
softmax_temperature: 0.01
random_seed: 666666
run_on_modal: true
output_frequency: 1
enforce_template: true
sample_with_reinsertion: false
reinject_initial: false
n_memory: 0
elitism: true
accept_only_improvement: true
